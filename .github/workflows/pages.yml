name: Publish chetsupro

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Prepare site
        run: unzip -q site.zip -d _site
      - name: Apply checked site updates
        run: python3 scripts/apply-site-updates.py _site site-updates.json
      - name: Remove private-use label
        run: python3 scripts/remove-private-label.py _site
      - name: Apply UI polish
        run: python3 scripts/apply-ui-polish.py _site
      - name: Apply speedups
        run: python3 scripts/apply-speedups.py _site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: chetsupro-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: chetsupro-pages-${{ github.run_id }}-${{ github.run_attempt }}
